<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="AI Writing Check: see how much of a document was likely written by AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b26"/>
      <stop offset="1" stop-color="#0d3445"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="118" font-size="20" font-weight="600" fill="#4fc3e8" letter-spacing="3">OPEN-SOURCE AI WRITING DETECTION</text>
    <text x="62" y="186" font-size="64" font-weight="700" fill="#ffffff">AI Writing Check</text>
    <text x="64" y="234" font-size="24" fill="#b7c9d6">See how much of a document was likely written by AI,</text>
    <text x="64" y="266" font-size="24" fill="#b7c9d6">sentence by sentence.</text>
  </g>

  <!-- report card -->
  <g transform="translate(790 48)">
    <rect width="346" height="224" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="26" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">42%</text>
    <rect x="140" y="42" width="180" height="10" rx="5" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="140" y="42" width="76" height="10" rx="5" fill="#4fc3e8"/>
    <g fill="#ffffff" fill-opacity="0.28">
      <rect x="26" y="96" width="294" height="10" rx="5"/>
      <rect x="26" y="118" width="250" height="10" rx="5"/>
      <rect x="26" y="140" width="120" height="10" rx="5"/>
    </g>
    <g fill="#4fc3e8" fill-opacity="0.85">
      <rect x="154" y="140" width="166" height="10" rx="5"/>
      <rect x="26" y="162" width="294" height="10" rx="5"/>
      <rect x="26" y="184" width="210" height="10" rx="5"/>
    </g>
  </g>
</svg>
